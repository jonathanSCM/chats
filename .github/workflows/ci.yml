name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    # Ubuntu usa glibc, igual que la imagen node:24-slim del Dockerfile: así
    # `npm ci` resuelve aquí el mismo árbol de dependencias que en el deploy,
    # y un lockfile desincronizado falla en el CI y no en producción.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Solo genera el cliente a partir del schema; no requiere una DB real.
      - run: npx prisma generate

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test

      # El build también entra al CI: es el paso que más veces rompió el
      # deploy, y no necesita base de datos (ninguna página consulta la DB
      # durante el prerender).
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          AUTH_SECRET: ci-placeholder
          APP_ENCRYPTION_KEY: Y2ktcGxhY2Vob2xkZXIta2V5Y2ktcGxhY2Vob2xkZXI=
