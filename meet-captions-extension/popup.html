<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ProShop CRM — Subtítulos de Meet</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon128.png" alt="" />
      <div><b>ProShop CRM</b><small id="sub">Asistente de reuniones</small></div>
    </header>

    <!-- Fuera de una reunión -->
    <main id="vMenu" hidden>
      <button class="item pri" id="bNew">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>
        <span><b>Nueva reunión</b><small>Inicia una reunión instantánea de Meet</small></span>
      </button>
      <div class="join">
        <label for="code">Unirse con enlace o código</label>
        <div class="row"><input id="code" placeholder="abc-defg-hij o enlace de Meet" autocomplete="off" spellcheck="false" /><button class="btn" id="bJoin">Unirse</button></div>
        <div class="err" id="err" hidden></div>
      </div>
      <button class="item" id="bOpen">
        <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        <span><b>Abrir Google Meet</b><small>Ir a meet.google.com</small></span>
      </button>
      <button class="item" id="bScreen">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        <span><b>Grabar pantalla</b><small>Se guarda en tu computador</small></span>
      </button>
      <p class="note">Al entrar a la reunión, haz clic en este ícono para abrir el panel y pulsa «Grabar».</p>
    </main>

    <!-- Dentro de una reunión -->
    <main id="vRoom" hidden>
      <button class="item pri" id="bPanel">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg>
        <span><b>Abrir el panel</b><small>Grabar y subtítulos en vivo</small></span>
      </button>
      <button class="item" id="bWin">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg>
        <span><b>Abrir en ventana separada</b><small>Para verlo en otra pantalla</small></span>
      </button>
      <button class="item" id="bScreen2">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        <span><b>Grabar pantalla</b><small>Se guarda en tu computador</small></span>
      </button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
