<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ProShop CRM — Asistente de reunión</title>
    <style>
      :root {
        --bg: #ffffff;
        --bg2: #f4f6f8;
        --fg: #111b21;
        --muted: #667781;
        --line: #e4e8ea;
        --accent: #00a884;
        --danger: #c62828;
        --danger-bg: #fdecea;
        --ok: #059669;
        --warn-bg: #fff7e6;
        --warn: #8a5a00;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111b21;
          --bg2: #1a252c;
          --fg: #e9edef;
          --muted: #8696a0;
          --line: #26343c;
          --danger-bg: #3a1c1c;
          --warn-bg: #3a2f14;
          --warn: #f2c66d;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }
      header h1 { margin: 0; font-size: 14px; font-weight: 600; }
      header .sub { color: var(--muted); font-size: 11.5px; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
      .dot.rec { background: #ef4444; animation: pulse 1.4s infinite; }
      @keyframes pulse { 50% { opacity: 0.35; } }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px 0; }
      .chip { background: var(--bg2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
      .chip.ok { color: var(--ok); }
      .chip.bad { color: var(--danger); }
      .notice { margin: 10px 14px 0; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; }
      .notice.error { background: var(--danger-bg); color: var(--danger); }
      .notice.warn { background: var(--warn-bg); color: var(--warn); }
      .notice.info { background: var(--bg2); color: var(--muted); }
      main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 10px 14px; }
      #captions { flex: 1; min-height: 0; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg2); }
      #captions p { margin: 0 0 8px; font-size: 14px; line-height: 1.5; }
      #captions .who { font-weight: 600; margin-right: 4px; }
      #captions .empty { color: var(--muted); font-size: 12.5px; }
      footer { padding: 10px 14px 14px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
      .row { display: flex; gap: 8px; }
      button {
        flex: 1; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
        background: var(--bg); color: var(--fg); font: inherit; font-weight: 500; cursor: pointer;
      }
      button.primary { background: var(--danger); border-color: var(--danger); color: #fff; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      label.toggle { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
      .ver { color: var(--muted); font-size: 11px; text-align: center; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1><span class="dot" id="dot"></span><span id="title">ProShop CRM</span></h1>
        <div class="sub" id="subtitle">Asistente de reunión</div>
      </div>
    </header>
    <div class="chips" id="chips"></div>
    <div id="notices"></div>
    <main>
      <div id="captions"><p class="empty">Los subtítulos aparecen aquí.</p></div>
    </main>
    <footer>
      <div class="row">
        <button class="primary" id="stopBtn" disabled>Detener y enviar</button>
        <button id="detachBtn">Separar en ventana</button>
      </div>
      <label class="toggle"><input type="checkbox" id="hideToggle" checked /> Ocultar los subtítulos de la pantalla de Meet</label>
      <div class="ver" id="ver"></div>
    </footer>
    <script src="sidepanel.js"></script>
  </body>
</html>
